<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramanya Go: 40 Kare 3D</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <div class="city-lights"></div>
    <canvas id="confetti-canvas"></canvas>

    <div id="ui-overlay">
        <!-- Sol Oyuncular -->
        <div class="side-hud">
            <div class="player-hud p1-border" id="hud-p1">
                <div class="avatar-circle">🎩</div>
                <div class="info">
                    <span class="player-label">SİZ</span>
                    <span class="money" id="money-p1">2000₺</span>
                    <div class="inventory" id="inv-p1">🏠 x0</div>
                </div>
            </div>
            <div class="player-hud p3-border" id="hud-p3">
                <div class="avatar-circle">🐕</div>
                <div class="info">
                    <span class="player-label">BOT 2</span>
                    <span class="money" id="money-p3">2000₺</span>
                    <div class="inventory" id="inv-p3">🏠 x0</div>
                </div>
            </div>
        </div>

        <!-- Merkez Kontrol -->
        <div class="dice-section">
            <div id="dice-result">🎲</div>
            <button id="roll-btn">ZARI FIRLAT</button>
            <div class="turn-indicator">SIRA: <span id="current-player-name">SİZDE</span></div>
        </div>

        <!-- Sağ Oyuncular -->
        <div class="side-hud">
            <div class="player-hud p2-border" id="hud-p2">
                <div class="info" style="text-align: right;">
                    <span class="player-label">BOT 1</span>
                    <span class="money" id="money-p2">2000₺</span>
                    <div class="inventory" id="inv-p2">🏢 x0</div>
                </div>
                <div class="avatar-circle">🏎️</div>
            </div>
            <div class="player-hud p4-border" id="hud-p4">
                <div class="info" style="text-align: right;">
                    <span class="player-label">BOT 3</span>
                    <span class="money" id="money-p4">2000₺</span>
                    <div class="inventory" id="inv-p4">🏢 x0</div>
                </div>
                <div class="avatar-circle">🚢</div>
            </div>
        </div>
    </div>

    <!-- 3D Tahta Konteyner -->
    <div id="board-container">
        <div id="board">
            <div id="p1-token" class="token">🎩</div>
            <div id="p2-token" class="token">🏎️</div>
            <div id="p3-token" class="token">🐕</div>
            <div id="p4-token" class="token">🚢</div>
        </div>
    </div>

    <div id="log-window">
        <div class="log-title">OYUN AKIŞI</div>
        <ul id="event-log"><li>Büyük dünya turuna hazır mısın?</li></ul>
    </div>

    <div id="modal-overlay" class="hidden">
        <div id="decision-box">
            <div class="card-icon">🎁</div>
            <h3 id="modal-title"></h3>
            <p id="modal-desc"></p>
            <div class="modal-btns">
                <button id="buy-btn" class="confirm">AL / EL KOY</button>
                <button id="skip-btn" class="cancel">VAZGEÇ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
